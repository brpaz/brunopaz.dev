name: Update draft release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: brpaz/draftsman@c8359ed96a2b991e763bd5f11cf2b5c1353e934c # v0.3.1
        with:
          command: draft
          backend: github
          token: ${{ secrets.GITHUB_TOKEN }}
