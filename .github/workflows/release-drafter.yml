name: Update draft release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: brpaz/draftsman@d5fe30680ff24c493d96b22aa5042e559a5b6c38 # v0.2.2
        with:
          command: draft
          backend: github
          token: ${{ secrets.GITHUB_TOKEN }}
